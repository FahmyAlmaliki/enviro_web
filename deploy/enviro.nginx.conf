# =============================================================================
# Enviro Monitor — reverse proxy /enviro (nginx / openresty)
# =============================================================================
# Aplikasi Next.js memakai basePath "/enviro" dan listen di port 3000.
#
# ATURAN UTAMA:
#   1. Gunakan `location /enviro` (TANPA garis miring di akhir).
#   2. Gunakan `proxy_pass http://<upstream>;` (TANPA path setelah host).
#      Dengan begitu URI asli, termasuk prefix /enviro, diteruskan apa adanya.
#   3. Letakkan blok ini SEBELUM fallback SPA `location /`.
#
# Salah satu dari dua pilihan upstream di bawah, sesuaikan kondisinya.
# =============================================================================

# -----------------------------------------------------------------------------
# KASUS A — nginx/openresty berjalan di server yang sama dengan Docker
# -----------------------------------------------------------------------------
upstream enviro_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# KASUS B — nginx/openresty di webproxy terpisah (mis. 175.45.185.120)
# Ganti dengan IP server Docker ini, dan buka port 3000 hanya untuk proxy.
# -----------------------------------------------------------------------------
# upstream enviro_app {
#     server 10.10.10.25:3000;
#     keepalive 32;
# }


# =============================================================================
# Blok server lengkap (contoh). Bila server block sudah ada, cukup salin
# bagian `location` saja ke dalam server block tersebut.
# =============================================================================
server {
    listen 80;
    server_name devel-ai.ub.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name devel-ai.ub.ac.id;

    # ssl_certificate     /etc/ssl/ub/devel-ai.crt;
    # ssl_certificate_key /etc/ssl/ub/devel-ai.key;

    # Agar batch ingest (maks 5000 titik) tidak ditolak 413
    client_max_body_size 8m;

    # -------------------------------------------------------------------------
    # 1. Aplikasi Enviro Monitor
    # -------------------------------------------------------------------------
    location /enviro {
        proxy_pass http://enviro_app;          # TANPA path di belakang host
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Polling 5 detik + query InfluxDB bisa lambat saat agregasi 30 hari
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Streaming response Next.js
        proxy_buffering off;

        # Hanya diperlukan bila nanti memakai SSE/WebSocket
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # 2. Cache aset statis Next.js (opsional, sangat disarankan)
    # -------------------------------------------------------------------------
    location /enviro/_next/static/ {
        proxy_pass http://enviro_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # 3. Aplikasi lama / SPA di root — TIDAK boleh menangkap /enviro
    # -------------------------------------------------------------------------
    location / {
        root /var/www/devel-ai;
        try_files $uri $uri/ /index.html;
    }
}


# =============================================================================
# Bila ingin membatasi endpoint ingest di level proxy (opsional)
# =============================================================================
# Tambahkan di konteks `http { }`:
#
#   limit_req_zone $binary_remote_addr zone=enviro_ingest:10m rate=10r/s;
#
# Lalu di dalam server block, sebelum location /enviro:
#
#   location = /enviro/api/ingest {
#       limit_req zone=enviro_ingest burst=20 nodelay;
#       proxy_pass http://enviro_app;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#   }
